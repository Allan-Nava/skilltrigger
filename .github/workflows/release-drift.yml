name: Release drift

# A merged release PR publishes nothing: the tag is the trigger and pushing it is
# manual. A sibling project's 0.1.1 sat on main untagged for a week and nothing said so.
# This says so.
#
# It fails when package.json's version has no skilltrigger--v<version> tag, once the commit
# that set the version is older than the grace a release PR needs between merging
# and tagging. It runs on push so a bump is checked, and daily so a quiet repo still
# hears about a tag nobody pushed — a failing scheduled run emails the owner.

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The check itself lives in backlogsync, shared by every repository that releases by
  # tag (ST-22): the tag is skilltrigger--v<version>, and a CHANGELOG heading that says
  # "not released" passes with a notice.
  drift:
    uses: Allan-Nava/backlogsync/.github/workflows/release-drift.yml@backlogsync--v0.1.0
